    <!-- HR Officer Access Restrictions: No Dashboard, No Reports -->
    <script>
    (function() {
      'use strict';

      var SESSION_KEY    = 'nasama_hr_session';
      var BLOCKED_ROLE   = 'hr_officer';
      var BLOCKED_PAGES  = ['Dashboard', 'Reports'];
      var REDIRECT_LABEL = 'Employees';
      var _roleCache     = null;

      // Cache the role so localStorage is not parsed on every MutationObserver tick.
      function getRole() {
        if (_roleCache !== null) return _roleCache;
        try {
          var raw = localStorage.getItem(SESSION_KEY);
          if (!raw) { _roleCache = ''; return ''; }
          var session = JSON.parse(raw);
          _roleCache = (session && session.role) ? session.role : '';
          return _roleCache;
        } catch(e) { _roleCache = ''; return ''; }
      }

      function isBlocked() {
        return getRole() === BLOCKED_ROLE;
      }

      // Strip leading emoji/symbols before comparing.
      // Falls back to the full trimmed string when no Latin letter exists
      // (icon-only items) so matching never silently breaks.
      function matchesNav(text, label) {
        if (!text || !label) return false;
        var stripped = text.trim().replace(/^[^A-Za-z0-9]*/, '').trim();
        var cleaned  = (stripped.length ? stripped : text.trim()).toLowerCase();
        var target   = label.toLowerCase();
        return cleaned === target || cleaned.endsWith(' ' + target);
      }

      // Hide blocked nav items. Receives the pre-queried NodeList from runPatches.
      function patchSidebar(navItems) {
        if (!isBlocked()) return;
        for (var i = 0; i < navItems.length; i++) {
          var text = navItems[i].textContent.trim();
          for (var j = 0; j < BLOCKED_PAGES.length; j++) {
            if (matchesNav(text, BLOCKED_PAGES[j])) {
              navItems[i].style.display = 'none';
            }
          }
        }
      }

      // Redirect away from blocked pages.
      // window._hrRedirecting prevents a click-loop while the SPA router catches up.
      function patchPageAccess(navItems) {
        if (!isBlocked()) return;
        var pageTitle = document.querySelector('.page-title');
        if (!pageTitle) return;
        var current = pageTitle.textContent.trim();

        var onBlockedPage = false;
        for (var j = 0; j < BLOCKED_PAGES.length; j++) {
          if (matchesNav(current, BLOCKED_PAGES[j])) { onBlockedPage = true; break; }
        }
        if (!onBlockedPage) return;
        if (window._hrRedirecting) return;

        for (var i = 0; i < navItems.length; i++) {
          if (matchesNav(navItems[i].textContent, REDIRECT_LABEL)) {
            window._hrRedirecting = true;
            navItems[i].click();
            setTimeout(function() { window._hrRedirecting = false; }, 600);
            return;
          }
        }
      }

      // Single DOM query shared by both patch functions.
      function runPatches() {
        var navItems = document.querySelectorAll('.nav-item');
        patchSidebar(navItems);
        patchPageAccess(navItems);
      }

      function startObserver() {
        if (!document.body) { setTimeout(startObserver, 50); return; }
        runPatches();
        var observer = new MutationObserver(function() {
          clearTimeout(observer._timer);
          observer._timer = setTimeout(runPatches, 60);
        });
        observer.observe(document.body, { childList: true, subtree: true });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startObserver);
      } else {
        startObserver();
      }
    })();
    </script>
