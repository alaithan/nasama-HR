<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./assets/nasama-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nasama HR - Real Estate Dubai</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module" crossorigin src="./assets/index-vk5KeLT9.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CTfi76Rh.css">

    <!-- HR Officer Access Restrictions: No Dashboard, No Reports -->
    <script>
    (function() {
      'use strict';

      var SESSION_KEY = 'nasama_hr_session';
      var BLOCKED_ROLE = 'hr_officer';
      var BLOCKED_PAGES = ['Dashboard', 'Reports'];
      var REDIRECT_LABEL = 'Employees';

      function getRole() {
        try {
          var raw = localStorage.getItem(SESSION_KEY);
          if (!raw) return null;
          var session = JSON.parse(raw);
          return session && session.role ? session.role : null;
        } catch(e) { return null; }
      }

      function isBlocked() {
        return getRole() === BLOCKED_ROLE;
      }

      function matchesNav(text, label) {
        if (!text || !label) return false;
        text = text.trim();
        return text === label ||
               text.endsWith(label) ||
               text.replace(/[^\w\s]/g, '').trim() === label;
      }

      // Hide Dashboard and Reports nav items in the sidebar
      function patchSidebar() {
        if (!isBlocked()) return;
        var navItems = document.querySelectorAll('.nav-item');
        for (var i = 0; i < navItems.length; i++) {
          var text = navItems[i].textContent.trim();
          for (var j = 0; j < BLOCKED_PAGES.length; j++) {
            if (matchesNav(text, BLOCKED_PAGES[j])) {
              navItems[i].style.display = 'none';
            }
          }
        }
      }

      // If HR officer lands on a blocked page, redirect to Employees
      function patchPageAccess() {
        if (!isBlocked()) return;
        var pageTitle = document.querySelector('.page-title');
        if (!pageTitle) return;
        var current = pageTitle.textContent.trim();

        var onBlockedPage = false;
        for (var j = 0; j < BLOCKED_PAGES.length; j++) {
          if (current === BLOCKED_PAGES[j]) { onBlockedPage = true; break; }
        }
        if (!onBlockedPage) return;

        // Click the Employees nav item to redirect
        var navItems = document.querySelectorAll('.nav-item');
        for (var i = 0; i < navItems.length; i++) {
          if (matchesNav(navItems[i].textContent, REDIRECT_LABEL)) {
            navItems[i].click();
            return;
          }
        }
      }

      function runPatches() {
        patchSidebar();
        patchPageAccess();
      }

      // Start observing DOM changes (React re-renders)
      function startObserver() {
        if (!document.body) {
          setTimeout(startObserver, 50);
          return;
        }

        runPatches();

        var observer = new MutationObserver(function() {
          clearTimeout(observer._timer);
          observer._timer = setTimeout(runPatches, 16);
        });

        observer.observe(document.body, {
          childList: true,
          subtree: true
        });

        setInterval(runPatches, 500);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startObserver);
      } else {
        startObserver();
      }
    })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
